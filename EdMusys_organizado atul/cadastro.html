<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdMusys — Novo Usuário</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #171711 0%, #111110 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #171514;
    }

    .cadastro-card {
      width: 400px;
      min-height: 560px;
      background: #faf8f3;
      border-radius: 18px;
      border-top: 5px solid #e5b400;
      padding: 38px 36px 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .cadastro-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #11100f;
      color: #f2c000;
      font-size: 29px;
      font-weight: bold;
    }

    .logo::before {
      content: "♫";
      transform: translateY(-1px);
    }

    .cadastro-header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 700;
      color: #11100f;
      margin-bottom: 4px;
    }

    .cadastro-header p {
      color: #8c8178;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #756b63;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e887f;
      font-size: 17px;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      height: 42px;
      padding: 0 13px 0 38px;
      border: 1px solid #ddd7ce;
      border-radius: 8px;
      outline: none;
      background: #fffefa;
      color: #4d4843;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input::placeholder {
      color: #8f8982;
    }

    .input-wrapper input:focus {
      border-color: #d7a900;
      box-shadow: 0 0 0 2px rgba(229, 180, 0, 0.12);
    }

    .btn-cadastrar {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      background: #11100f;
      color: #f2c000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-cadastrar:hover {
      background: #1d1b19;
      transform: translateY(-1px);
    }

    .btn-voltar {
      display: block;
      width: fit-content;
      margin: 18px auto 0;
      border: 0;
      background: transparent;
      color: #8c8178;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-voltar:hover {
      color: #b28700;
    }

    .mensagem {
      display: none;
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 7px;
      text-align: center;
      font-size: 12px;
    }

    .mensagem.erro {
      display: block;
      background: #f8e8e5;
      color: #a33b30;
    }

    .mensagem.sucesso {
      display: block;
      background: #e9f2e3;
      color: #48743c;
    }

    @media (max-width: 480px) {
      .cadastro-card {
        width: calc(100% - 32px);
        padding: 34px 25px 28px;
      }
    }
  </style>
</head>

<body>

  <main class="cadastro-card"> <!-- caixa de cadastro usuario-->

    <header class="cadastro-header">
      <div class="logo"></div>

      <h1>EdMusys</h1>
      <p>CADASTRAR ADMINISTRADOR</p>
    </header>

    <form id="formCadastro">

      <div class="form-group">
        <label for="nome">NOME COMPLETO</label>

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Informe seu nome completo"
            autocomplete="name"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-MAIL</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Informe seu e-mail"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="senha">CRIAR SENHA</label>

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">CONFIRMAR SENHA</label>

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-cadastrar">
        Cadastrar Usuário
      </button>

      <div id="mensagem" class="mensagem"></div>

    </form>

    <button
      type="button"
      class="btn-voltar"
      onclick="history.back()"
    >
      Voltar para o login
    </button>

  </main> <!-- tad fecha caixa de cadastro usuario-->

  <script>
    const form = document.getElementById("formCadastro");
    const senha = document.getElementById("senha");
    const confirmarSenha = document.getElementById("confirmarSenha");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      mensagem.className = "mensagem";
      mensagem.textContent = "";

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senhaValor = senha.value;
      const confirmarSenhaValor = confirmarSenha.value;

      //verifica o tamanho da senha
      if (senha.value.length < 8) {
        mensagem.textContent = "A senha deve possuir pelo menos 8 caracteres.";
        mensagem.classList.add("erro");
        return;
      }

      //verifica se as senhas são iguais
      if (senha.value !== confirmarSenha.value) {
        mensagem.textContent = "As senhas não são iguais.";
        mensagem.classList.add("erro");
        return;
      }

      // 3. Recupera os administradores já cadastrados
    const administradores =
        JSON.parse(localStorage.getItem("edmusys_admins")) || [];

        // 4. Verifica se o e-mail já está cadastrado
    const emailExiste = administradores.some(
        admin => admin.email === email
    );

    if (emailExiste) {
        mensagem.textContent =
            "Este e-mail já está cadastrado.";

        mensagem.classList.add("erro");
        return;
    }

    // 5. Cria o novo administrador
    const novoAdministrador = {
        nome: nome,
        email: email,
        senha: senhaValor
    };

    // 6. Adiciona o administrador à lista
    administradores.push(novoAdministrador);

    // 7. Salva novamente no navegador
    localStorage.setItem(
        "edmusys_admins",
        JSON.stringify(administradores)
    );


      mensagem.textContent = "Usuário cadastrado com sucesso!";
      mensagem.classList.add("sucesso");

      //limpa formulário
      form.reset();

      // 10. Depois de 1 segundo, volta para o login
    setTimeout(function() {
        window.location.href = "index.html";
    }, 1000);
    });
// FALTA MEXER NO JS PRA RODAR

  </script>

</body>
</html>
