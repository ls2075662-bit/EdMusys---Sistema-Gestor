<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    

    <aside class="sidebar">

        <h2>🎵 Educação Musical</h2>

        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="professores.html">Professores</a>
            <a href="alunos.html">Alunos</a>
            <a href="matriculas.html">Matrículas</a>
        </nav>

        <button onclick="window.location.href='admin.html'">
        ← Voltar ao Dashboard
        </button>

    </aside>

    <main class="content">

        <h1>Cadastro de Professores</h1>

        <form id="professorForm" class="form-card">

            <input
                type="text"
                id="nome"
                placeholder="Nome Completo"
                required
            >

            <input
                type="text"
                id="cpf"
                placeholder="CPF"
                required
            >

            <input
                type="text"
                id="telefone"
                placeholder="Telefone"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <h3>Instrumentos</h3>

            <div class="checkbox-group">

                <label><input type="checkbox" value="Violão"> Violão</label>
                <label><input type="checkbox" value="Guitarra"> Guitarra</label>
                <label><input type="checkbox" value="Baixo"> Baixo</label>
                <label><input type="checkbox" value="Piano"> Piano</label>
                <label><input type="checkbox" value="Teclado"> Teclado</label>
                <label><input type="checkbox" value="Bateria"> Bateria</label>
                <label><input type="checkbox" value="Canto"> Canto</label>

            </div>

            <h3>Disponibilidade</h3>

            <select id="dia">

                <option>Segunda-feira</option>
                <option>Terça-feira</option>
                <option>Quarta-feira</option>
                <option>Quinta-feira</option>
                <option>Sexta-feira</option>
                <option>Sábado</option>

            </select>

            <select id="horario">

                <option>08:00</option>
                <option>09:00</option>
                <option>10:00</option>
                <option>11:00</option>

                <option>14:00</option>
                <option>15:00</option>
                <option>16:00</option>
                <option>17:00</option>
                <option>18:00</option>
                <option>19:00</option>
                <option>20:00</option>
                <option>21:00</option>

            </select>

            <button type="button" id="addHorario">
                Adicionar Horário
            </button>

            <div id="listaHorarios"></div>

            <button type="submit">
                Salvar Professor
            </button>

        </form>

        <hr>

        <h2>Professores Cadastrados</h2>

        <input
        type="text"
        id="pesquisaProfessor"
        placeholder="Pesquisar professor..."
        >

        <div id="professoresLista"></div>

    </main>

</div>

<script src="js/professores.js"></script>

</body>
</html>
