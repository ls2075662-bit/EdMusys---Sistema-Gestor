<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educação Musical</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">

        <div class="logo-area">
            <h1>🎵 Educação Musical</h1>
            <p>Sistema de Gestão</p>
        </div>

        <div class="login-card">

            <h2>Entrar</h2>

            <form id="loginForm">

                <label>E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label>Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
