<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrículas - Educação Musical</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard">

    <input type="checkbox" id="menuToggle">

    <label for="menuToggle" class="menu-btn">
        <span class="hamburger"><span></span><span></span><span></span></span>
        🎵 Educação Musical
    </label>

    <label for="menuToggle" class="sidebar-overlay"></label>

    <aside class="sidebar">

        <h2>🎵 Educação Musical</h2>

        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="professores.html">Professores</a>
            <a href="alunos.html">Alunos</a>
            <a href="matriculas.html" class="active">Matrículas</a>
        </nav>

        <button onclick="window.location.href='admin.html'">
        ← Voltar ao Dashboard
        </button>

    </aside>

    <main class="content">

        <header class="topbar">
            <h1>Matrículas</h1>
        </header>

        <form id="matriculaForm" class="form-card">

            <label>Aluno</label>

            <select id="alunoSelect">
            </select>

            <label>Professor</label>

            <select id="professorSelect">
            </select>

            <label>Instrumento</label>

            <select id="instrumentoSelect">
            </select>

            <label>Horários</label>

            <select id="horarioSelect">
            </select>

            <button
            type="button"
            id="addHorarioMatricula">

                Adicionar Horário

            </button>

            <div id="horariosSelecionados">
            </div>

            <h3>
                Valor Mensal:
                R$
                <span id="valorMensal">
                    0
                </span>
            </h3>

            <button type="submit">

                Salvar Matrícula

            </button>

        </form>

        <hr>

        <h2>Matrículas Ativas</h2>

        <div id="listaMatriculas">
        </div>

    </main>

</div>

<script src="js/matriculas.js"></script>

</body>
</html>
