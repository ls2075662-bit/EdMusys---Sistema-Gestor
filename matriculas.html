<main class="content">

    <h1>Matrículas</h1>

    <form id="matriculaForm" class="form-card">

        <label>Aluno</label>

        <select id="alunoSelect">
        </select>

        <label>Professor</label>

        <select id="professorSelect">
        </select>

        <label>Instrumento</label>

        <select id="instrumentoSelect">
        </select>

        <label>Horários</label>

        <select id="horarioSelect">
        </select>

        <button
        type="button"
        id="addHorarioMatricula">

            Adicionar Horário

        </button>

        <div id="horariosSelecionados">
        </div>

        <h3>
            Valor Mensal:
            R$
            <span id="valorMensal">
                0
            </span>
        </h3>

        <button type="submit">

            Salvar Matrícula

        </button>

    </form>

    <hr>

    <h2>Matrículas Ativas</h2>

    <div id="listaMatriculas">
    </div>

</main>
